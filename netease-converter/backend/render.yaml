services:
  - type: web
    name: netease-mc-converter
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/api.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
