# 可选反向代理配置 / optional reverse proxy (fronting the container)
#
# 适用场景:
#   1) 不想用 Cloudflare 代理, 想自己用 Let's Encrypt 证书;
#   2) 一台 VPS 上跑多个站点, 用 nginx 按域名分发。
#
# 用法:
#   - 把本文件放到 /etc/nginx/conf.d/baianb.kdns.fr.conf
#   - 申请证书:  certbot --nginx -d baianb.kdns.fr
#   - 重载:      nginx -t && systemctl reload nginx
#
# 容器通过 docker-compose 映射在 127.0.0.1:8000, 这里只做透传。

server {
    listen 80;
    server_name baianb.kdns.fr;

    # certbot 会自动把 80 跳转与证书配置加进来

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;   # 允许上传较大的建筑文件
    }
}
